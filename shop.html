<!DOCTYPE html>
<html class=''>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.bopimo.com/static/dist/css/main.df693f58df1f9154db1be13ba421d0a4.css">
    <link rel="icon" type="image/png" href="https://cdn.bopimo.com/static/images/favicon.png">
    <title>Shop - Ludimo!</title>
    <meta property="og:site_name" content="Ludimo!" />
    <meta property="og:title" content="Shop - Ludimo!" />

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <style>
      .top-user-bar {
        background: #7b2cbf;
        color: white;
        padding: 8px 20px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 14px;
      }
      .top-user-bar img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 2px solid white;
      }
      .coins-display {
        background: #f8f0ff;
        border: 2px solid #7b2cbf;
        border-radius: 10px;
        padding: 12px 20px;
        margin: 20px 0;
        text-align: center;
        font-size: 1.3rem;
        font-weight: bold;
        color: #7b2cbf;
      }
      .empty-desert {
        text-align: center;
        padding: 100px 20px;
        color: #bbb;
      }
      .empty-desert h2 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: #eee;
      }
      .empty-desert p {
        font-size: 1.15rem;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="content" id='app'>

      <!-- Purple logged-in bar -->
      <div class="top-user-bar" id="userBar" style="display: none;">
        <span>👥 0</span>
        <span>✉️ 0</span>
        <span>😊 0</span>
        <span id="topUsername">Player</span>
        <span>◆ 1</span>
        <img id="topAvatar" src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt="avatar">
      </div>

      <nav class='navbar '>
        <div class='container'>
          <ul class='left'>
            <li class="logo">
              <a href='/'>
                <img src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt='landing'>
              </a>
              <div class="hamburger-menu" onclick="toggleNavbar()"><i class="fas fa-bars"></i></div>
            </li>
            <li><a href="https://ludimo.de5.net/play.html">Play</a></li>
            <li><a href="https://ludimo.de5.net/shop.html">Shop</a></li>
            <li><a href="https://ludimo.de5.net/user.html">Users</a></li>
            <li><a href="https://ludimo.de5.net/download.html">Download</a></li>
            <li><a href="https://ludimo.de5.net/upgrade.html">Upgrade</a></li>
          </ul>
          <ul class="right no-padding" id="authButtons">
            <li><a href="https://ludimo.de5.net/login.html">Login</a></li>
            <li><a href="https://ludimo.de5.net/register.html">Register</a></li>
          </ul>
        </div>
      </nav>
      <div class="nav-push"></div>

      <div class="container">

        <!-- Coins Display -->
        <div class="coins-display" id="coinsDisplay" style="display: none;">
          🪙 Your Coins: <span id="coinAmount">0</span>
        </div>

        <!-- Shop component -->
        <shop></shop>

        <!-- Empty state -->
        <div class="empty-desert" id="emptyState">
          <h2>This desert is Empty</h2>
          <p>Check back soon</p>
        </div>
      </div>

      <div class="footer ">
        <div class="container">
          <div class="row">
            <div class="col-xs col-md-4 company-stuff">
              <div class="logo">
                <img src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt="">
              </div>
              <div class="company-text"><span class="copyright">©</span> 2026 Ludimo!</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ========== FIREBASE ==========
      const firebaseConfig = {
        apiKey: "AIzaSyBTMZGd3zCBsf8OaHsDW8LHqTxegqUF4ww",
        authDomain: "ludimo-2d3ae.firebaseapp.com",
        projectId: "ludimo-2d3ae",
        storageBucket: "ludimo-2d3ae.firebasestorage.app",
        messagingSenderId: "229714978642",
        appId: "1:229714978642:web:d9df65ea75f666dea8bc8b",
        measurementId: "G-N83VLBHX2T"
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // ========== KEEP LOGGED IN + SHOW COINS ==========
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          const userDoc = await db.collection("users").doc(user.uid).get();
          const data = userDoc.data() || {};
          const username = data.username || user.displayName || "Player";
          const coins = data.coins || 0;

          // Show purple bar + username
          document.getElementById("topUsername").innerText = username;
          document.getElementById("userBar").style.display = "flex";

          // Show coins
          document.getElementById("coinAmount").innerText = coins;
          document.getElementById("coinsDisplay").style.display = "block";

          // Replace Login/Register with Logout
          document.getElementById("authButtons").innerHTML = `
            <li><a href="#" id="logoutBtn">Logout</a></li>
          `;

          document.getElementById("logoutBtn").addEventListener("click", async (e) => {
            e.preventDefault();
            await auth.signOut();
            window.location.href = "https://ludimo.de5.net/login.html";
          });

        } else {
          // Not logged in
        }
      });

      function toggleNavbar() {
        var navbar = document.getElementsByClassName("navbar")[0];
        navbar.classList.toggle("open");
      }

      // Empty shop fallback
      window.addEventListener('load', function() {
        setTimeout(function() {
          const shop = document.querySelector('shop');
          const emptyState = document.getElementById('emptyState');
          if (shop && shop.innerHTML.trim().length < 50) {
            emptyState.style.display = 'block';
          } else {
            emptyState.style.display = 'none';
          }
        }, 800);
      });
    </script>
  </body>
</html>
