    <script>
      let cdn = "https://cdn.bopimo.com";
      function localFallback() {
        // js
        document.querySelectorAll(`script[src^="${cdn}"]`).forEach((script) => {
          let url = script.getAttribute('src')
          let path = new URL(url).pathname.split('static')[1]
          var script = document.createElement('script');
          script.onload = function() {
            console.log('loading script')
          };
          script.src = path;
          document.head.appendChild(script);
        })
      }
      function localCssFallback() {
        // css
        document.querySelectorAll(`link[href^="${cdn}"]`).forEach((style) => {
          console.log(style)
          let url = style.getAttribute('href')
          let path = new URL(url).pathname.split('static')[1]
          var link = document.createElement('link');
          link.href = path
          link.rel = 'stylesheet'
          document.head.appendChild(link);
        })
      }
      function localFallbacks() {
        localFallback()
        localCssFallback()
      }
      function cdnCheck() {
        window.Vue || (localFallbacks())
      }
    </script>

    <script>
      function toggleNavbar() {

        navbar.classList.toggle("open");
      }

      // Simple fallback: if the shop component stays empty after a short time, keep the message visible
      window.addEventListener('load', function() {
        setTimeout(function() {
          const shop = document.querySelector('shop');
          const emptyState = document.getElementById('emptyState');

          // If shop component has almost no content, show the empty message
          if (shop && shop.innerHTML.trim().length < 50) {
            emptyState.style.display = 'block';
          } else {
            emptyState.style.display = 'none';
          }
        }, 800);
      });
    </script>
