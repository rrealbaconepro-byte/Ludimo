  </head>
  <body>
    <div class="content" id='app'>
      <nav class='navbar '>
        <div class='container'>
          <ul class='left'>
            <li class="logo">
              <a href='/'>
                <img src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt='landing'>
              </a>
              <div class="hamburger-menu" onclick="toggleNavbar()"><i class="fas fa-bars"></i></div>
            </li>

            <li><a href="https://ludimo.de5.net/shop.html">Shop</a></li>
            <li><a href="https://ludimo.de5.net/user.html">Users</a></li>
            <li><a href="https://ludimo.de5.net/download.html">Download</a></li>
            <li><a href="https://ludimo.de5.net/upgrade.html">Upgrade</a></li>
          </ul>
          <ul class="right no-padding">
            <li><a href="https://ludimo.de5.net/login.html">Login</a></li>
            <li><a href="https://ludimo.de5.net/register.html">Register</a></li>
          </ul>
        </div>
      </nav>
      <div class="nav-push"></div>

      <div class="container ">
        <div class="col-xs-12 col-md-4 col-md-offset-4">
          <div class="h3 pb2 text-center">Register</div>
          <div class="shop-card">
            <div class='card-content'>
              <form class="form p1" id="registerForm">
                <label class='form-label'>Username</label>
                <input type='text' id="username" class='form-input' placeholder='Username' required>

                <label class='form-label'>Email</label>
                <input type='email' id="email" class='form-input' placeholder='Email' required>

                <label class='form-label'>Password</label>
                <input type='password' id="password" class='form-input' placeholder='Password' required minlength="6">

                <label class='form-label'>Birthday</label>
                <input class='form-input' id="birthday" type="date" required>

                <div class='mb2'>
                  <div class='checkbox-agree'>
                    <div class='checkbox'>
                      <input id='terms_of_service' type='checkbox' required>
                    </div>
                    <div class="flex-grow lh2">
                      <label for='terms_of_service'>
                        I have read and agree to Ludimo!'s 
                        <a class='link' href='https://ludimo.de5.net/terms.html'>terms of service</a> 
                        and 
                        <a class='link' href='https://ludimo.de5.net/privacy.html'>privacy policy</a>.
                      </label>
                    </div>
                  </div>
                </div>

                <div id="errorMessage" style="color: #ff4d4d; margin-bottom: 12px; display: none;"></div>
                <div id="successMessage" style="color: #4caf50; margin-bottom: 12px; display: none;"></div>

                <button type='submit' class="button w100 pb2" id="registerBtn">Register</button>
              </form>

              <div class='text-center pt2 pb1'>
                <a href='https://ludimo.de5.net/login.html'>Already have an account?</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer ">
        <div class="container">
          <div class="row">
            <div class="col-xs col-md-4 company-stuff">
              <div class="logo">
                <img src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt="">
              </div>
              <div class="company-text"><span class="copyright">©</span> 2026 Ludimo!</div>
              <div class="social-media">
                <a href='https://x.com/playludimo' title='Twitter'><i class="fab fa-twitter"></i></a>
                <a href='https://www.twitch.tv/ludimo' title='Twitch'><i class="fab fa-twitch"></i></a>
                <a href='https://www.youtube.com/@Bbrootorg' title='Youtube'><i class="fab fa-youtube"></i></a>
              </div>
            </div>
            <div class="col-xs-12 col-md-8 footer-links">
              <div class="row">
                <div class="col-xs-6 col-md mb4-m">
                  <div class="title">Community</div>
                  <a href="/staff">Staff</a>
                  <a href="/blog">Blog</a>
                  <a href="/events">Events</a>
                  <a href="/challenges">Challenges</a>
                </div>
                <div class="col-xs-6 col-md mb4-m">
                  <div class="title">Support</div>
                  <a href="/contact">Contact</a>
                  <a href="/parents">Parents</a>
                  <a href="/status">Status</a>
                </div>
                <div class="col-xs-12 col-md">
                  <div class="title">Legal</div>
                  <a href="https://ludimo.de5.net/terms.html">Terms of Service</a>
                  <a href="https://ludimo.de5.net/privacy.html">Privacy Policy</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ========== FIREBASE CONFIG ==========
      const firebaseConfig = {
        apiKey: "AIzaSyBTMZGd3zCBsf8OaHsDW8LHqTxegqUF4ww",
        authDomain: "ludimo-2d3ae.firebaseapp.com",
        projectId: "ludimo-2d3ae",
        storageBucket: "ludimo-2d3ae.firebasestorage.app",
        messagingSenderId: "229714978642",
        appId: "1:229714978642:web:d9df65ea75f666dea8bc8b",
        measurementId: "G-N83VLBHX2T"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // ========== REGISTER LOGIC ==========
      const form = document.getElementById('registerForm');
      const errorMsg = document.getElementById('errorMessage');
      const successMsg = document.getElementById('successMessage');
      const registerBtn = document.getElementById('registerBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const birthday = document.getElementById('birthday').value;

        // Reset messages
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating account...';

        try {
          // 1. Create Auth account
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          const user = userCredential.user;

          // 2. Save extra data in Firestore
          await db.collection('users').doc(user.uid).set({
            username: username,
            email: email,
            birthday: birthday,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            coins: 0,
            spirit: 0,
            isGold: false
          });

          // Update displayName
          await user.updateProfile({
            displayName: username
          });

          successMsg.textContent = 'Account created successfully! Redirecting...';
          successMsg.style.display = 'block';

          // Redirect to home dashboard
          setTimeout(() => {
            window.location.href = 'https://ludimo.de5.net/home.html';
          }, 1500);

        } catch (error) {
          console.error(error);
          let message = 'Something went wrong. Please try again.';

          if (error.code === 'auth/email-already-in-use') {
            message = 'This email is already registered.';
          } else if (error.code === 'auth/weak-password') {
            message = 'Password should be at least 6 characters.';
          } else if (error.code === 'auth/invalid-email') {
            message = 'Please enter a valid email.';
          }

          errorMsg.textContent = message;
          errorMsg.style.display = 'block';
          registerBtn.disabled = false;
          registerBtn.textContent = 'Register';
        }
      });

      // Navbar toggle
      function toggleNavbar() {
        var navbar = document.getElementsByClassName("navbar")[0];
        navbar.classList.toggle("open");
      }
    </script>
  </body>
</html>
