<!DOCTYPE html>
<html class=''>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.bopimo.com/static/dist/css/main.df693f58df1f9154db1be13ba421d0a4.css">
    <link rel="icon" type="image/png" href="https://cdn.bopimo.com/static/images/favicon.png">
    <title>Login - Ludimo!</title>
    <meta property="og:site_name" content="Ludimo!" />
    <meta property="og:title" content="Login - Ludimo!" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  </head>
  <body>
    <div class="content" id='app'>
      <nav class='navbar '>
        <div class='container'>
          <ul class='left'>
            <li class="logo">
              <a href='/'>
                <img src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt='landing'>
              </a>
              <div class="hamburger-menu" onclick="toggleNavbar()"><i class="fas fa-bars"></i></div>
            </li>
            <li><a href="https://ludimo.de5.net/play.html">Play</a></li>
            <li><a href="https://ludimo.de5.net/shop.html">Shop</a></li>
            <li><a href="https://ludimo.de5.net/user.html">Users</a></li>
            <li><a href="https://ludimo.de5.net/download.html">Download</a></li>
            <li><a href="https://ludimo.de5.net/upgrade.html">Upgrade</a></li>
          </ul>
          <ul class="right no-padding">
            <li><a href="https://ludimo.de5.net/login.html">Login</a></li>
            <li><a href="https://ludimo.de5.net/register.html">Register</a></li>
          </ul>
        </div>
      </nav>
      <div class="nav-push"></div>

      <div class="container ">
        <div class="col-xs-12 col-md-4 col-md-offset-4">
          <div class="h3 pb2 text-center">Login</div>
          <div class="shop-card">
            <div class="card-content p2">
              <form class="form" id="loginForm">
                <label class='form-label'>Email</label>
                <input type='email' id="email" class='form-input' placeholder='Email' required>

                <label class='form-label'>Password</label>
                <input type='password' id="password" class='form-input mb1' placeholder='Password' required>

                <div class='mb3'>
                  <input type="checkbox" id="remember"> 
                  <label for="remember">Remember me</label>
                </div>

                <div id="errorMessage" style="color: #ff4d4d; margin-bottom: 12px; display: none;"></div>
                <div id="successMessage" style="color: #4caf50; margin-bottom: 12px; display: none;"></div>

                <button type='submit' class="button w100 pb2" id="loginBtn">Login</button>

                <div class='text-center pt2 pb1'>
                  <a href='https://ludimo.de5.net/register.html'>Don't have an account? Register</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="footer ">
        <div class="container">
          <div class="row">
            <div class="col-xs col-md-4 company-stuff">
              <div class="logo">
                <img src="https://i.postimg.cc/J4Dfqk0d/l-Sn-UK-removebg-preview.png" alt="">
              </div>
              <div class="company-text"><span class="copyright">©</span> 2026 Ludimo!</div>
              <div class="social-media">
                <a href='https://x.com/playludimo' title='Twitter'><i class="fab fa-twitter"></i></a>
                <a href='https://www.twitch.tv/ludimo' title='Twitch'><i class="fab fa-twitch"></i></a>
                <a href='https://www.youtube.com/@Bbrootorg' title='Youtube'><i class="fab fa-youtube"></i></a>
              </div>
            </div>
            <div class="col-xs-12 col-md-8 footer-links">
              <div class="row">
                <div class="col-xs-6 col-md mb4-m">
                  <div class="title">Community</div>
                  <a href="/staff">Staff</a>
                  <a href="/blog">Blog</a>
                  <a href="/events">Events</a>
                  <a href="/challenges">Challenges</a>
                </div>
                <div class="col-xs-6 col-md mb4-m">
                  <div class="title">Support</div>
                  <a href="/contact">Contact</a>
                  <a href="/parents">Parents</a>
                  <a href="/status">Status</a>
                </div>
                <div class="col-xs-12 col-md">
                  <div class="title">Legal</div>
                  <a href="https://ludimo.de5.net/terms.html">Terms of Service</a>
                  <a href="https://ludimo.de5.net/privacy.html">Privacy Policy</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ========== FIREBASE CONFIG ==========
      const firebaseConfig = {
        apiKey: "AIzaSyBTMZGd3zCBsf8OaHsDW8LHqTxegqUF4ww",
        authDomain: "ludimo-2d3ae.firebaseapp.com",
        projectId: "ludimo-2d3ae",
        storageBucket: "ludimo-2d3ae.firebasestorage.app",
        messagingSenderId: "229714978642",
        appId: "1:229714978642:web:d9df65ea75f666dea8bc8b",
        measurementId: "G-N83VLBHX2T"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      // ========== LOGIN LOGIC ==========
      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('errorMessage');
      const successMsg = document.getElementById('successMessage');
      const loginBtn = document.getElementById('loginBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const remember = document.getElementById('remember').checked;

        // Reset messages
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        try {
          // Set persistence (Remember me)
          const persistence = remember 
            ? firebase.auth.Auth.Persistence.LOCAL 
            : firebase.auth.Auth.Persistence.SESSION;

          await auth.setPersistence(persistence);

          // Sign in
          await auth.signInWithEmailAndPassword(email, password);

          successMsg.textContent = 'Login successful! Redirecting...';
          successMsg.style.display = 'block';

          // Redirect to home dashboard
          setTimeout(() => {
            window.location.href = 'https://ludimo.de5.net/home.html';
          }, 1000);

        } catch (error) {
          console.error(error);
          let message = 'Something went wrong. Please try again.';

          if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
            message = 'Incorrect email or password.';
          } else if (error.code === 'auth/invalid-email') {
            message = 'Please enter a valid email.';
          } else if (error.code === 'auth/too-many-requests') {
            message = 'Too many failed attempts. Try again later.';
          }

          errorMsg.textContent = message;
          errorMsg.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      });

      // Navbar toggle
      function toggleNavbar() {
        var navbar = document.getElementsByClassName("navbar")[0];
        navbar.classList.toggle("open");
      }
    </script>
  </body>
</html>
